# Production stack: Traefik front, /api -> ncapp (FastAPI), /panel -> ncview (Panel).
# FastAPI + Celery scaled to all cores. TLS/domain/LB handled by an external proxy.
# Config comes from .env (see .env in this directory). For a local smoke test set
# PUBLIC_SCHEME=http and PUBLIC_HOST=<machine-ip>; in production use https + domain.
services:
  traefik:
    # v3.7+ negotiates the Docker API version; older Traefik defaults to the
    # legacy 1.24 which Docker Engine 29.x rejects (min API 1.40).
    image: traefik:v3.7.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      # Rootless Docker socket (see .env DOCKER_SOCK). In rootless mode the
      # container's root maps to the host user, so it can read this socket.
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro"
    restart: unless-stopped

  ncview:
    image: epinux/ncmet:latest
    build:
      context: ./docker
    environment:
      PORT: '7000'
      LOG_LEVEL: 'info'
      PANEL_PREFIX: '${PANEL_PREFIX:-/panel}'
      PANEL_ALLOW_ORIGIN: '${PANEL_ALLOW_ORIGIN:-*}'
      TSPLOT_DOWNLOAD: '/tspt/Download'
      PROCESSING_ENDPOINT: 'http://ncapp:8000'
      DOWNLOAD_ENDPOINT: '${PUBLIC_SCHEME:-https}://${PUBLIC_HOST}/api'
      DOWNLOAD_SIGNING_KEY: '${DOWNLOAD_SIGNING_KEY}'
      API_BASE: '${API_BASE:-/api}'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '/app:/seaice:/seaicemod:/opt/metviz'
      SEAICE_APP_ROOT: '/seaice'
      SEAICEMOD_APP_ROOT: '/seaicemod'
    volumes:
      - ./metviz/trj:/TRJ
      - ./metviz/TSP:/TSP
      - ./metviz/catalog:/Catalog
      - ./metviz/OGC_client:/OGC_client
      - ./metviz/common:/opt/metviz/common
      - ./metviz/assets:/assets
      - ./docker/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/entrypoint.sh"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.panel.rule=PathPrefix(`/panel`)
      - traefik.http.routers.panel.entrypoints=web
      - traefik.http.services.panel.loadbalancer.server.port=7000
    restart: unless-stopped

  ncapp:
    build:
      context: ./ncapp
    # Rootless Docker maps container-root to the unprivileged host user, which
    # owns the download-data named volume — so run as root to write/read it.
    user: "0:0"
    environment:
      TSPLOT_DOWNLOAD: '/data/Download'
      DOWNLOAD_SIGNING_KEY: '${DOWNLOAD_SIGNING_KEY}'
      DOWNLOAD_TTL_SECONDS: '600'
      CELERY_BROKER_URL: 'redis://redis:6379/0'
      CELERY_RESULT_BACKEND: 'redis://redis:6379/0'
      PANEL_TSP_URL: '${PUBLIC_SCHEME:-https}://${PUBLIC_HOST}/panel/TSP'
      PANEL_TRJ_URL: '${PUBLIC_SCHEME:-https}://${PUBLIC_HOST}/panel/TRJ'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '/app:/opt/metviz'
    volumes:
      - ./ncapp/app:/app
      - ./metviz/common:/opt/metviz/common
      - download-data:/data/Download
    command: >
      sh -c 'exec uvicorn main:app --host 0.0.0.0 --port 8000
      --workers ${UVICORN_WORKERS:-$(nproc)}
      --proxy-headers --forwarded-allow-ips=* --root-path /api'
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.middlewares=api-strip
      - traefik.http.middlewares.api-strip.stripprefix.prefixes=/api
      - traefik.http.services.api.loadbalancer.server.port=8000
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./ncapp
    # See ncapp: run as root so it can write the shared download-data volume.
    user: "0:0"
    working_dir: /app
    environment:
      TSPLOT_DOWNLOAD: '/data/Download'
      DOWNLOAD_SIGNING_KEY: '${DOWNLOAD_SIGNING_KEY}'
      DOWNLOAD_TTL_SECONDS: '600'
      CELERY_BROKER_URL: 'redis://redis:6379/0'
      CELERY_RESULT_BACKEND: 'redis://redis:6379/0'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '/app:/opt/metviz'
    volumes:
      - ./ncapp/app:/app
      - ./metviz/common:/opt/metviz/common
      - download-data:/data/Download
    command: >
      sh -c 'exec celery -A worker.celery worker --beat --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-$(nproc)}'
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  download-data:
  redis-data:
